<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSQTTR · Ручные хеши и аккаунты VK</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; font-family: Roboto, "Segoe UI", sans-serif; color: #eaf0f8; background: #0e1219; }
body { margin: 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding: 20px max(18px, calc((100vw - 1150px) / 2)); background: #151b25; border-bottom: 1px solid #2a3546; }
h1 { font-size: 23px; margin: 0 0 5px; font-weight: 650; }
header p { margin: 0; color: #aab7c9; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; }
.controls label { display: grid; gap: 4px; color: #bac7d8; font-size: 12px; }
button, select, input { font: inherit; }
.controls select { color: #f4f7fc; background: #212b3b; border: 1px solid #3a4a61; border-radius: 8px; padding: 7px 9px; }
.controls input { width: 100px; accent-color: #74a5f5; }
:focus-visible { outline: 2px solid #5a97f3; outline-offset: 3px; }
.viewport { width: 100%; min-height: calc(100vh - 106px); overflow: auto; padding: 20px 16px 32px; }
.board { --scale: .88; display: flex; gap: 26px; width: max-content; margin: 0 auto; align-items: start; zoom: var(--scale); }
.example { width: 385px; }
.example h2 { margin: 0 0 4px; font-size: 17px; }
.example > p { margin: 0 0 11px; color: #aab7c9; font-size: 13px; }
.phone {
  --bg:#101216; --surface:#191c22; --field:#242830; --line:#343942; --fg:#f1f3f7;
  --muted:#aeb3bd; --accent:#1769e2; --on:#fff; --soft:#15345c; --radius:16px;
  position: relative; isolation: isolate; height: 710px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 29px; background: var(--bg); color: var(--fg);
  box-shadow: 0 18px 45px #0005; color-scheme: dark;
}
[data-design="classic"] .phone { --bg:#0b0b0c; --surface:#161618; --field:#222225; --line:#37373c; --fg:#f4f4f5; --muted:#babac2; --accent:#1565d8; --soft:#162d55; --radius:20px; }
[data-design="old"] .phone { --bg:#0b0d10; --surface:#1c222c; --field:#252e3b; --line:#39475b; --fg:#edf2f9; --muted:#b3bfd0; --accent:#3a69a0; --soft:#263b55; }
[data-theme="light"] .phone {
  --bg:#fdfdfe; --surface:#fff; --field:#f2f2f4; --line:#d9dce2; --fg:#161a21; --muted:#4f5868;
  --accent:#125ecb; --soft:#dfebfb; color-scheme: light;
}
[data-theme="light"] [data-design="classic"] .phone { --bg:#f7f7f8; --surface:#fbfbfc; --field:#eeeef0; --line:#d7d7db; --fg:#1b1b1d; --muted:#555561; --accent:#145ec5; --soft:#e2ecfb; }
[data-theme="light"] [data-design="old"] .phone { --bg:#eef2f7; --surface:#f7f9fc; --field:#e6ebf3; --line:#cbd4e2; --fg:#192332; --muted:#455468; --accent:#345d92; --soft:#dbe7f8; }
.status { height: 30px; padding: 7px 17px 0; font-size: 12px; display: flex; justify-content: space-between; }
.app { padding: 12px 16px; }
.app h3 { margin: 0 0 14px; font-size: 17px; }
.summary { display: grid; gap: 9px; padding: 12px; background: var(--field); border-radius: var(--radius); }
.summary div { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; }
.summary span { color: var(--muted); }
.summary button { justify-self: start; }
.nav { position: absolute; inset: auto 0 17px; display: flex; justify-content: space-around; color: var(--muted); font-size: 11px; }
.nav strong { color: var(--fg); }
.scrim { position: absolute; inset: 30px 0 0; background: #0007; }
.sheet { position: absolute; inset: auto 0 0; padding: 9px 15px 18px; background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); min-height: 462px; max-height: 620px; display: flex; flex-direction: column; }
[data-design="classic"][data-panel="hashes"] .sheet { inset: 117px 12px auto; min-height: 0; border: 1px solid var(--line); border-radius: 26px; padding-top: 15px; }
[data-design="classic"][data-panel="hashes"] .handle { display: none; }
.handle { width: 34px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 10px; }
.sheet-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-title h3 { margin: 0; font-size: 18px; }
.sheet-content { margin: 12px 0 16px; display: grid; gap: 11px; overflow: auto; min-height: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend, .field-label { font-size: 12px; font-weight: 650; margin-bottom: 5px; color: var(--muted); }
.source-list, .account-list { display: grid; gap: 5px; }
.hash-row, .account { display: flex; align-items: center; gap: 9px; border-radius: 11px; padding: 7px 10px; min-height: 40px; background: var(--field); font-size: 13px; }
.account input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.hash-row small { display: block; color: var(--muted); margin-top: 2px; }
.hash-row > button { margin-left: auto; }
.hash-actions, .actions, .modes { display: flex; gap: 7px; align-items: center; }
.actions { justify-content: space-between; }
.modes > button, .hash-actions input { flex: 1; min-width: 0; }
.modes > button { padding-inline: 5px; }
button { cursor: pointer; }
.phone button { color: var(--fg); border: 1px solid var(--line); background: var(--field); border-radius: var(--radius); padding: 8px 11px; min-height: 35px; font-size: 12px; font-weight: 650; }
.phone button.primary, .phone button[aria-pressed="true"] { background: var(--accent); color: var(--on); border-color: var(--accent); }
.phone button.text-button { background: transparent; border-color: transparent; }
.phone button.close { border-radius: 50%; width: 34px; padding: 0; font-size: 20px; }
.phone input[type="text"] { min-height: 35px; background: var(--field); border: 1px solid var(--line); border-radius: 11px; color: var(--fg); font-size: 12px; padding: 7px 9px; width: 100%; }
.phone input::placeholder { color: var(--muted); }
.note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.35; }
.account-cta { display: grid; gap: 6px; }
.feedback { color: var(--muted); font-size: 12px; min-height: 1.2em; margin: 8px 0 0; }
[hidden] { display: none !important; }
@media (max-width: 540px) { header { align-items: start; } .controls { gap: 7px; } .viewport { padding-inline: 10px; } }

.board { --scale: .76; }
.example h2 { margin-bottom: 10px; }
.summary label { color: var(--muted); }
.select-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
.select-row select { padding: 7px; color: var(--fg); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.own-field { display: grid; gap: 3px; padding: 7px 8px; border-radius: 11px; background: var(--field); font-size: 11px; color: var(--muted); }
.own-field input[type="text"] { min-height: 30px; background: var(--surface); }
.own-field small { color: var(--muted); font-size: 11px; }
.own-field .good { color: #54bc73; }
.own-field .bad { color: #ef7777; }
[data-theme="light"] .own-field .good { color: #26703d; }
[data-theme="light"] .own-field .bad { color: #ad2929; }
.account button:first-child { flex: 1; }
.phone button:disabled { opacity: .55; cursor: default; }
.hash-footer > button { flex: 1; }

</style>
</head>
<body>
<header>
  <div><h1>Ручные хеши и аккаунты VK</h1><p>Интерактивный макет · демонстрационные данные и статусы проверки</p></div>
  <div class="controls">
    <label>Тема<select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
    <label>Заполнить шесть полей<select id="fixture"><option value="">Пустые поля</option><option value="links">Шесть ссылок</option><option value="hashes">Шесть хешей</option><option value="mixed">Три ссылки и три хеша</option></select></label>
    <label>Масштаб <output id="zoom-value">76%</output><input type="range" id="zoom" min="45" max="115" value="76"></label>
  </div>
</header>
<main class="viewport">
  <div class="board" id="board" data-theme="dark">
    <article class="example" data-design="classic"><h2>CSQTT 2.5.0</h2></article>
    <article class="example" data-design="modern"><h2>CSQTTR 2.5.3</h2></article>
    <article class="example" data-design="old"><h2>Старый</h2></article>
  </div>
</main>
<template id="screen">
  <div class="phone">
    <div class="status" aria-hidden="true"><span>12:00</span><span>▮▮ ◢ ▰</span></div>
    <div class="app">
      <h3>Туннель</h3>
      <div class="summary">
        <div><span>Профиль</span><strong>Тестовый</strong></div>
        <div><span>IP и порт</span><strong>203.0.113.25:54321</strong></div>
        <label class="select-row">Режим хешей
          <select data-mode aria-label="Режим хешей">
            <option value="manual">Ручные хеши</option><option value="api">Авто API</option><option value="vk">Авто ВК</option>
          </select>
        </label>
        <button type="button" data-action="open">Настроить хеши</button>
        <button type="button" data-action="manage" hidden>Аккаунты VK</button>
      </div>
    </div>
    <div class="nav" aria-hidden="true"><span>Подкл.</span><strong>Туннель</strong><span>Деплой</span><span>Логи</span><span>Маршрут</span></div>
    <div class="scrim"></div>
    <section class="sheet" aria-label="Настройки хешей">
      <div class="handle"></div>
      <div class="sheet-title">
        <h3></h3>
        <button type="button" class="close" data-action="close" aria-label="Закрыть">×</button>
      </div>
      <div class="sheet-content"></div>
      <div class="actions hash-footer">
        <button type="button" data-action="check">Проверить</button>
        <button type="button" class="primary" data-action="save">Сохранить</button>
      </div>
    </section>
  </div>
</template>
<script>
const board = document.querySelector("#board");
const modeNames = {manual:"Ручные хеши",api:"Авто API",vk:"Авто ВК"};
const checks = ["Работает", "Не работает", "Не удалось проверить"];
const sampleHashes = Array.from({length:6}, (_, i) => "DemoVKHash-1234567" + (i + 1));
let accounts = [1, 2];
let activeAccount = 1;
let nextAccount = 3;

const views = [...board.querySelectorAll(".example")].map(example => {
  example.append(document.querySelector("#screen").content.cloneNode(true));
  return {example, mode:"manual", panel:"hashes", returnPanel:"tunnel", source:"owner", owner:[true,true],
    fields:Array(6).fill(""), checked:false, removing:null};
});

function escape(value) {
  return value.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function normalize(value) {
  return value.trim()
    .replace(/^(?:https?:\/\/)?(?:m\.)?vk\.(?:com|ru)\/call\/join\//i, "")
    .split(/[?#]/,1)[0].replace(/\/+$/,"");
}

function ownRows(view) {
  return view.fields.map((value, index) => {
    const hash = normalize(value);
    const status = !hash ? "" : hash.length < 16 ? "Минимум 16 символов" : view.checked ? checks[index % 3] : "Не проверен";
    const tone = !hash || !view.checked ? "" : index % 3 === 0 ? "good" : index % 3 === 1 ? "bad" : "";
    return '<label class="own-field"><span>Хеш ' + (index + 1) + '</span><input type="text" data-field="' + index +
      '" value="' + escape(value) + '" placeholder="Ссылка VK или хеш" spellcheck="false">' +
      (status ? '<small class="' + tone + '">' + status + '</small>' : "") + '</label>';
  }).join("");
}

function ownerRows(view) {
  return view.owner.map((enabled,index) => '<div class="hash-row"><span>От владельца ' + (index + 1) +
    '<small>' + (enabled ? view.checked ? checks[index] : "Хеш скрыт · не проверен" : "Убран") + '</small></span>' +
    '<button type="button" data-action="replace" data-index="' + index + '">' + (enabled ? "Заменить" : "Вернуть") + '</button></div>').join("");
}

function hashesPanel(view) {
  const tabs = [["owner","От владельца"],["own","Свои"]].map(([key,label]) =>
    '<button type="button" data-action="source" data-source="' + key + '" aria-pressed="' + (view.source===key) + '">' + label + '</button>').join("");
  return '<button type="button" data-action="manage">Аккаунты VK</button>' +
    '<div class="modes" role="group" aria-label="Источник ручных хешей">' + tabs + '</div>' +
    '<p class="note">Ссылки на VK-звонки или готовые хеши</p><div class="source-list">' +
    (view.source === "owner" ? ownerRows(view) : ownRows(view)) + '</div>' +
    (view.checked ? '<p class="note" role="status">Демонстрационный результат · статус указан у каждого хеша</p>' : "");
}

function accountsPanel(view) {
  if (view.removing !== null) {
    return '<p class="note">Профили серверов и остальные аккаунты сохранятся.</p>' +
      '<div class="actions"><button type="button" data-action="cancel-remove">Отмена</button>' +
      '<button type="button" class="primary" data-action="confirm-remove">Удалить</button></div>';
  }
  const rows = accounts.map((id,index) => '<div class="account"><button type="button" data-action="select-account" data-index="' + id +
    '" aria-pressed="' + (activeAccount===id) + '">Аккаунт ' + (index + 1) + (activeAccount===id ? " · выбран" : "") +
    '</button><button type="button" data-action="remove-account" data-index="' + id + '" aria-label="Удалить аккаунт ' + (index+1) + '">×</button></div>').join("");
  return '<p class="note">Личный аккаунт общий для ваших профилей</p>' +
    (rows || '<p class="note">Сохранённых аккаунтов пока нет</p>') +
    '<button type="button" class="primary" data-action="add-account">Добавить / сменить аккаунт</button>';
}

function render(view) {
  const root = view.example;
  root.dataset.panel = view.panel;
  const isClassic = root.dataset.design === "classic";
  const inHashes = view.panel === "hashes";
  root.querySelector(".scrim").hidden = root.querySelector(".sheet").hidden = view.panel === "tunnel";
  root.querySelector(".hash-footer").hidden = !inHashes;
  root.querySelector(".sheet-title h3").textContent = inHashes ? isClassic ? "VK Хеши" : "Ручные хеши" :
    view.removing === null ? "Аккаунты VK" : "Удалить аккаунт из CSQTT?";
  root.querySelector("[data-mode]").value = view.mode;
  root.querySelector(".summary [data-action=open]").hidden = view.mode !== "manual";
  root.querySelector(".summary [data-action=manage]").hidden = view.mode === "manual";
  root.querySelector(".summary [data-action=manage]").textContent = activeAccount ? "Аккаунт VK подключён" : "Войти в VK";
  root.querySelector(".sheet-content").innerHTML = inHashes ? hashesPanel(view) : accountsPanel(view);
  const count = new Set([...view.fields.map(normalize), ...view.owner.flatMap((on,i) => on ? ["DemoOwnerHash-1234567"+i] : [])].filter(x => x.length >= 16)).size;
  const check = root.querySelector("[data-action=check]");
  check.disabled = !count;
  check.textContent = isClassic ? "Проверить актив" : "Проверить (" + count + ")";
}

for (const view of views) {
  view.example.addEventListener("input", event => {
    if (event.target.dataset.field === undefined) return;
    view.fields[Number(event.target.dataset.field)] = event.target.value;
    view.checked = false;
    const count = new Set(view.fields.map(normalize).filter(x => x.length >= 16)).size + view.owner.filter(Boolean).length;
    const check = view.example.querySelector("[data-action=check]");
    check.disabled = !count;
    if (view.example.dataset.design !== "classic") check.textContent = "Проверить (" + count + ")";
  });
  view.example.addEventListener("change", event => {
    if (!event.target.matches("[data-mode]") || !modeNames[event.target.value]) return;
    view.mode = event.target.value;
    render(view);
  });
  view.example.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const index = Number(button.dataset.index);
    switch(button.dataset.action) {
      case "open": view.panel = "hashes"; break;
      case "close":
        view.panel = view.panel === "accounts" ? view.returnPanel : "tunnel";
        view.removing = null;
        break;
      case "save": view.fields = view.fields.map(normalize); view.panel = "tunnel"; break;
      case "check": view.fields = view.fields.map(normalize); view.checked = true; break;
      case "source": view.source = button.dataset.source; break;
      case "replace":
        view.owner[index] = !view.owner[index];
        if (!view.owner[index]) {
          view.source = "own";
          render(view);
          const free = view.fields.findIndex(field => !field.trim());
          view.example.querySelector('[data-field="' + free + '"]')?.focus();
          return;
        }
        break;
      case "manage": view.returnPanel = view.panel; view.panel = "accounts"; break;
      case "select-account": activeAccount = index; view.panel = view.returnPanel; views.forEach(render); return;
      case "add-account": accounts.push(nextAccount); activeAccount = nextAccount++; views.forEach(render); return;
      case "remove-account": view.removing = index; break;
      case "cancel-remove": view.removing = null; break;
      case "confirm-remove":
        accounts = accounts.filter(id => id !== view.removing);
        if (activeAccount === view.removing) activeAccount = null;
        view.removing = null;
        views.forEach(render);
        return;
    }
    render(view);
  });
}

document.querySelector("#theme").addEventListener("change", e => { board.dataset.theme = e.target.value; });
document.querySelector("#zoom").addEventListener("input", e => {
  board.style.setProperty("--scale", Number(e.target.value) / 100);
  document.querySelector("#zoom-value").value = e.target.value + "%";
});
document.querySelector("#fixture").addEventListener("change", e => {
  const kind = e.target.value;
  for (const view of views) {
    view.fields = sampleHashes.map((hash,i) => !kind ? "" : kind === "links" || (kind === "mixed" && i % 2 === 0)
      ? "https://" + (i % 2 === 0 ? "vk.com" : "m.vk.ru") + "/call/join/" + hash : hash);
    view.panel = "hashes";
    view.source = "own";
    view.checked = false;
    render(view);
  }
});
views.forEach(render);
</script>
</body>
</html>
